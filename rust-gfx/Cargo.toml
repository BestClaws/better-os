[package]
name = "rust-gfx"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []

[dependencies]
libm = "0.2.15"
micromath = "2.1.0"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-json-core = { version = "0.5", default-features = false }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5.8", default-features = false }

[dev-dependencies]
png = "0.17"

[package]
name = "rust-gfx"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []

[[bin]]
name = "sprite_generator"
path = "examples/sprite_generator.rs"

[dependencies]
heapless = { version = "0.9", default-features = false, features = ["serde"] }
libm = "0.2.15"
micromath = "2.1.0"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-json-core = { version = "0.5", default-features = false }

[dev-dependencies]
png = "0.17"

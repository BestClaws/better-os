[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-http-proxy"
version = "0.1.0"
description = "Generic BLE HTTP proxy companion for Better OS devices."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Better-OS", email = "devnull@example.com" }]
dependencies = [
    "bleak>=0.22",
    "httpx>=0.27",
]

[project.scripts]
ble-http-proxy = "ble_http_proxy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

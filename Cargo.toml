[package]
edition = "2021"
name    = "better-os"
version = "0.1.0"

[[bin]]
name = "better-os"
path = "src/main.rs"
test = false

[dependencies]


heapless = { version = "0.8.0", features = ["defmt-03"] }
esp-hal = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp32c6",
  "unstable",
  "rt"
] }
esp-wifi = { version = "0.15.0", features = [
  "ble",
  "builtin-scheduler",
  "defmt",
  "esp-alloc",
  "esp32c6",
] }
esp-alloc = "0.8.0"
esp-hal-embassy = { version = "0.9.0", features = ["esp32c6"] }

embedded-hal = { version = "1.0.0", features = ["defmt-03"] }
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-graphics-core = { version = "0.4.0", features = ["defmt"] }

defmt = "1.0.1"


panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.1", features = ["defmt"] }

nb = "1.1.0"

embassy-executor = { version = "0.7.0", features = [
  "defmt",
  "task-arena-size-81920",
] }
embassy-time = { version = "0.4.0", features = ["generic-queue-8", "defmt"] }


static_cell = { version = "2.1.0", features = [] }

trouble-host = { version = "0.2.4", features = [
    "default-packet-pool-mtu-255", "derive", "scan"
] }

kolibri-embedded-gui = { path = "../kolibri"}
embedded-graphics = { version = "0.8.0", features = ["defmt"] }
ssd1306 = { version = "0.10.0", features = ["async", "graphics"] }

display-interface-i2c = { version = "0.5.0" }
display-interface = "0.5.0"
display-interface-spi = { version = "0.5.0"}
ili9341 = { version = "0.6.0", features = ["embedded-graphics-core", "graphics"] }

mpu6050-dmp = { version = "0.6.0", features = ["async", "defmt-03"] }
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }

micromath = "2.1.0"

embassy-futures = "0.1.1"
bt-hci = "0.3.0"
embassy-sync = { version = "0.7.0" }
log = "0.4.27"
async-trait = "0.1.88"

tinybmp = { version = "0.6.0", features = [] }
libm = "0.2.15"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false



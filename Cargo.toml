[workspace]
resolver = "2"
members = [
    "gfx",
]
# better-os is excluded like esp-hal excludes examples/target-specific binaries
# because it requires riscv32imac target and will fail workspace checks
# Build it from its own directory: cd better-os && cargo build
exclude = [
    "better-os",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/better-os"

[workspace.dependencies]
# Graphics library
gfx = { path = "gfx", default-features = false }

# Embassy
embassy-executor = { version = "0.9.0" }
embassy-time = { version = "0.5.0" }
embassy-embedded-hal = { version = "0.5.0" }
embassy-futures = "0.1.1"
embassy-sync = { version = "0.7.0" }

# ESP HAL
esp-hal = { version = "1.0.0" }
esp-alloc = { version = "0.9.0" }
esp-radio = { version = "0.17.0" }
esp-rtos = { version = "0.2.0" }
esp-bootloader-esp-idf = { version = "0.4.0" }

# Bluetooth
trouble-host = { version = "0.5.0" }
bt-hci = { version = "0.6" }

# Embedded
embedded-graphics = { version = "0.8.1", default-features = false }
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }

# Serialization
serde = { version = "1.0", default-features = false }
serde-json-core = { version = "0.5.1", default-features = false }

# Math and utilities
micromath = "2.1.0"
fixed = "1.28.0"
libm = "0.2.15"

# Image processing
miniz_oxide = { version = "0.7", default-features = false }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5.8", default-features = false }
tinybmp = { version = "0.6.0" }

# Logging and debug
defmt = "1.0.1"
log = "0.4.27"
panic-rtt-target = { version = "0.2.0" }
rtt-target = { version = "0.6.1" }

# HTTP
httparse = { version = "1.9.4", default-features = false }

# Utilities
static_cell = "2.1.1"
nb = "1.1.0"
async-trait = "0.1.88"

[patch.crates-io]
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal.git", rev = "6b735e1510d75b8620503ae6aa2f7fd6948dfa08" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false


